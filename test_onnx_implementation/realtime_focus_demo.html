<!DOCTYPE html>
<html lang="ko">
<head>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
<meta charset="UTF-8">
<title>실시간 집중도 분석 데모 (MediaPipe)</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Malgun Gothic", sans-serif;
    background: #0f172a;
    color: #f1f5f9;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  p.sub { color: #94a3b8; font-size: 13px; margin-top: 0; margin-bottom: 20px; }

  #stage {
    position: relative;
    width: 640px;
    max-width: 92vw;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 0 0 2px #1e293b;
    transition: box-shadow 0.2s ease;
  }
  #stage.alert {
    box-shadow: 0 0 0 6px #ef4444;
  }
  video, canvas {
    width: 100%;
    display: block;
  }
  canvas { position: absolute; top: 0; left: 0; }

  #status {
    margin-top: 16px;
    width: 640px;
    max-width: 92vw;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #1e293b;
    border-radius: 10px;
    padding: 14px 18px;
    font-size: 14px;
  }
  #stateLabel { font-weight: bold; font-size: 16px; }
  #stateLabel.focused { color: #38bdf8; }
  #stateLabel.unfocused { color: #ef4444; }
  #stateLabel.idle { color: #94a3b8; }

  #warningBanner {
    margin-top: 12px;
    width: 640px;
    max-width: 92vw;
    background: #ef4444;
    color: white;
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 14px;
    text-align: center;
    display: none;
  }
  #warningBanner.show { display: block; }

  #metrics {
    margin-top: 16px;
    width: 640px;
    max-width: 92vw;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .metric {
    background: #0f1b2e;
    border: 1px solid #1e293b;
    border-radius: 8px;
    padding: 10px;
    text-align: center;
  }
  .metric .label { font-size: 11px; color: #94a3b8; }
  .metric .value { font-size: 18px; font-weight: bold; margin-top: 4px; }

  #startBtn {
    margin-top: 20px;
    background: #38bdf8;
    color: #0f172a;
    border: none;
    padding: 10px 24px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
  }
  #startBtn:disabled { opacity: 0.5; cursor: default; }

  #log {
    margin-top: 16px;
    width: 640px;
    max-width: 92vw;
    height: 100px;
    overflow-y: auto;
    background: #0f1b2e;
    border: 1px solid #1e293b;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 11px;
    color: #94a3b8;
    font-family: monospace;
  }
</style>
</head>
<body>

<h1>실시간 집중도 분석 데모</h1>
<p class="sub">MediaPipe Face/Pose Landmarker · 로컬 브라우저에서만 실행 (서버 전송 없음)</p>

<button id="startBtn">웹캠 시작</button>

<div id="stage">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
</div>

<div id="warningBanner">⚠ 집중력이 저하된 것 같아요. 자세를 확인해보세요.</div>

<div id="status">
  <span>현재 상태</span>
  <span id="stateLabel" class="idle">대기 중</span>
</div>

<div id="metrics">
  <div class="metric"><div class="label">고개 각도(左右)</div><div class="value" id="mHead">-</div></div>
  <div class="metric"><div class="label">비집중 지속시간</div><div class="value" id="mIdleTime">0.0s</div></div>
  <div class="metric"><div class="label">비집중 이벤트 수</div><div class="value" id="mEventCount">0</div></div>
</div>

<div id="log">로그가 여기 표시됩니다...</div>

<script type="module">
import {
  FaceLandmarker,
  PoseLandmarker,
  FilesetResolver,
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const video = document.getElementById("video");
const overlay = document.getElementById("overlay");
const ctx = overlay.getContext("2d");
const startBtn = document.getElementById("startBtn");
const stage = document.getElementById("stage");
const stateLabel = document.getElementById("stateLabel");
const warningBanner = document.getElementById("warningBanner");
const mHead = document.getElementById("mHead");
const mIdleTime = document.getElementById("mIdleTime");
const mEventCount = document.getElementById("mEventCount");
const logBox = document.getElementById("log");

async function testFocusAI() {
    try {
        console.log("Loading ONNX model...");
        // Load the ONNX file we just created
        const session = await ort.InferenceSession.create('./focus_classifier.onnx');
        
        // Create a dummy array of 15 zeros (representing the 15 features)
        // Order: [is_front_camera, is_overhead_camera, face_seen, gaze_down, gaze_side, bad_posture, eye_closed, blink, long_eye_closure, head_down, head_tilt, drowsy, page_turn, pen_fidget, restless_hand]
        const dummyFeatures = new Float32Array(16);
        
        // Let's pretend we are using the front camera and looking straight at it
        dummyFeatures[0] = 1.0; // is_front_camera = true
        dummyFeatures[2] = 1.0; // face_seen = true

        // ONNX requires a specific tensor format: data type, the data itself, and the shape [batch_size, num_features]
        const tensor = new ort.Tensor('float32', dummyFeatures, [1, 16]);
        
        // 'float_input' matches the exact input name generated during our Python conversion
        const feeds = { float_input: tensor };
        
        console.log("Running inference...");
        const results = await session.run(feeds);
        
        // Output the predicted state
        console.log("Prediction Result:", results.output_label.data[0]);
        
        // Output the flat array of probability numbers
        console.log("Probabilities:", results.output_probability.data);
        
    } catch (error) {
        console.error("Failed to run the model:", error);
    }
}

// Fire the test
testFocusAI();

function log(msg) {
  const time = new Date().toLocaleTimeString("ko-KR", { hour12: false });
  logBox.innerHTML = `[${time}] ${msg}<br>` + logBox.innerHTML;
}

let faceLandmarker, poseLandmarker;
let running = false;

// ---- 판단 로직 상태값 ----
let noMovementStartTime = null; // 고개+손이 정지된 시작 시각
let idleEventCount = 0;
const IDLE_THRESHOLD_SEC = 4; // 4~5초 정지 시 "비집중"으로 판단 (팀 기존 로직 반영)
let lastHeadYaw = null;
let lastHandY = null;

async function setupModels() {
  log("MediaPipe 모델 로딩 중...");
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );

  faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
      delegate: "GPU",
    },
    outputFacialTransformationMatrixes: true,
    runningMode: "VIDEO",
    numFaces: 1,
  });

  poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
      delegate: "GPU",
    },
    runningMode: "VIDEO",
    numPoses: 1,
  });

  log("모델 로딩 완료.");
}

async function startWebcam() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { width: 640, height: 480 },
    audio: false,
  });
  video.srcObject = stream;
  await new Promise((resolve) => (video.onloadedmetadata = resolve));
  overlay.width = video.videoWidth;
  overlay.height = video.videoHeight;
}

function setState(state) {
  stateLabel.textContent =
    state === "focused" ? "집중" : state === "unfocused" ? "비집중" : "대기 중";
  stateLabel.className = state;
  if (state === "unfocused") {
    stage.classList.add("alert");
    warningBanner.classList.add("show");
  } else {
    stage.classList.remove("alert");
    warningBanner.classList.remove("show");
  }
}

function predictLoop() {
  if (!running) return;
  const nowMs = performance.now();

  const faceResult = faceLandmarker.detectForVideo(video, nowMs);
  const poseResult = poseLandmarker.detectForVideo(video, nowMs);

  ctx.clearRect(0, 0, overlay.width, overlay.height);

  let headYaw = null;
  let handY = null;

  // --- 얼굴: 고개 각도(요, yaw) 추정 (transformation matrix 기반 간이 계산) ---
  if (faceResult.facialTransformationMatrixes && faceResult.facialTransformationMatrixes.length > 0) {
    const m = faceResult.facialTransformationMatrixes[0].data;
    // 회전행렬에서 yaw 각도 근사 추출 (라디안 -> 도)
    headYaw = Math.atan2(-m[8], Math.sqrt(m[9] * m[9] + m[10] * m[10])) * (180 / Math.PI);
    mHead.textContent = headYaw.toFixed(1) + "°";

    // 얼굴 랜드마크 점 그리기 (간단 시각화)
    ctx.fillStyle = "#38bdf8";
    const lm = faceResult.faceLandmarks[0];
    for (let i = 0; i < lm.length; i += 5) {
      ctx.beginPath();
      ctx.arc(lm[i].x * overlay.width, lm[i].y * overlay.height, 1.2, 0, Math.PI * 2);
      ctx.fill();
    }
  } else {
    mHead.textContent = "얼굴 없음";
  }

  // --- 자세: 손목 위치 추정 (간이 움직임 감지용) ---
  if (poseResult.landmarks && poseResult.landmarks.length > 0) {
    const lm = poseResult.landmarks[0];
    const leftWrist = lm[15];
    const rightWrist = lm[16];
    handY = ((leftWrist?.y ?? 0) + (rightWrist?.y ?? 0)) / 2;

    ctx.strokeStyle = "#facc15";
    ctx.lineWidth = 2;
    ctx.beginPath();
    if (leftWrist) ctx.arc(leftWrist.x * overlay.width, leftWrist.y * overlay.height, 5, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    if (rightWrist) ctx.arc(rightWrist.x * overlay.width, rightWrist.y * overlay.height, 5, 0, Math.PI * 2);
    ctx.stroke();
  }

  // --- 판단 로직: 고개 각도 변화 거의 없음 + 손 움직임 거의 없음 => 정지 상태 누적 ---
  const headMoved = lastHeadYaw !== null && headYaw !== null && Math.abs(headYaw - lastHeadYaw) > 3;
  const handMoved = lastHandY !== null && handY !== null && Math.abs(handY - lastHandY) > 0.01;

  const noFace = !faceResult.facialTransformationMatrixes || faceResult.facialTransformationMatrixes.length === 0;

  if (noFace) {
    // 자리이탈
    if (noMovementStartTime === null) noMovementStartTime = nowMs;
    setState("unfocused");
    logOnceLeave();
  } else if (!headMoved && !handMoved) {
    if (noMovementStartTime === null) noMovementStartTime = nowMs;
    const idleSec = (nowMs - noMovementStartTime) / 1000;
    mIdleTime.textContent = idleSec.toFixed(1) + "s";
    if (idleSec >= IDLE_THRESHOLD_SEC) {
      setState("unfocused");
    } else {
      setState("focused");
    }
  } else {
    noMovementStartTime = null;
    mIdleTime.textContent = "0.0s";
    setState("focused");
  }

  lastHeadYaw = headYaw ?? lastHeadYaw;
  lastHandY = handY ?? lastHandY;

  requestAnimationFrame(predictLoop);
}

let lastLeaveLogTime = 0;
function logOnceLeave() {
  const now = Date.now();
  if (now - lastLeaveLogTime > 3000) {
    idleEventCount++;
    mEventCount.textContent = idleEventCount;
    log("자리이탈 감지됨 (얼굴 미검출)");
    lastLeaveLogTime = now;
  }
}

startBtn.addEventListener("click", async () => {
  startBtn.disabled = true;
  startBtn.textContent = "로딩 중...";
  try {
    await setupModels();
    await startWebcam();
    running = true;
    startBtn.textContent = "실행 중";
    log("실시간 분석 시작");
    requestAnimationFrame(predictLoop);
  } catch (err) {
    log("오류: " + err.message);
    startBtn.disabled = false;
    startBtn.textContent = "웹캠 시작";
    console.error(err);
  }
});
</script>

</body>
</html>
